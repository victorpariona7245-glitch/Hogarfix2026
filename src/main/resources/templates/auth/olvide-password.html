<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>HogarFix - Recuperar contraseña</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="/css/styles.css" rel="stylesheet" />
    <style>body { font-family: "Inter", sans-serif; }</style>
  </head>
  <body class="min-h-screen flex items-center justify-center auth-gradient p-4">
    <div class="w-full max-w-md relative">
      <a th:href="@{/auth/login}" class="absolute -top-10 left-0 text-sm flex items-center gap-1 hover:text-primary transition-colors" style="color: var(--muted-foreground);">
        <span aria-hidden="true">←</span> Volver a iniciar sesión
      </a>
      <div class="card p-8 shadow-2xl rounded-2xl">
        <h1 class="text-2xl font-medium mb-1">¿Olvidaste tu contraseña?</h1>

        <div th:if="${enviado}" class="p-3 mt-4 text-sm rounded-lg" style="background-color:#dcfce7; color:#166534;">
          Si ese correo está registrado, te enviamos un enlace para crear una contraseña nueva.
          Revisa también la carpeta de spam. El enlace dura 30 minutos.
        </div>

        <div th:unless="${enviado}">
          <p class="text-sm mb-6" style="color: var(--muted-foreground);">
            Escribe el correo con el que te registraste y te enviaremos un enlace para restablecerla.
          </p>
          <form th:action="@{/auth/olvide}" method="post" class="space-y-4">
            <div>
              <label class="form-label" for="email">Correo electrónico</label>
              <input type="email" name="email" id="email" placeholder="tu@email.com" maxlength="100" class="form-input" required autofocus />
            </div>
            <button type="submit" class="btn-primary w-full">Enviar enlace</button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>

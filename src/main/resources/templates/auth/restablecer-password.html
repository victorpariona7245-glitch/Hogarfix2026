<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>HogarFix - Nueva contraseña</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="/css/styles.css" rel="stylesheet" />
    <style>body { font-family: "Inter", sans-serif; }</style>
  </head>
  <body class="min-h-screen flex items-center justify-center auth-gradient p-4">
    <div class="w-full max-w-md relative">
      <a th:href="@{/auth/login}" class="absolute -top-10 left-0 text-sm flex items-center gap-1 hover:text-primary transition-colors" style="color: var(--muted-foreground);">
        <span aria-hidden="true">←</span> Volver a iniciar sesión
      </a>
      <div class="card p-8 shadow-2xl rounded-2xl">
        <h1 class="text-2xl font-medium mb-1">Crea tu nueva contraseña</h1>

        <div th:if="${!tokenValido}">
          <div class="p-3 mt-4 mb-4 text-sm rounded-lg" style="background-color:#fee2e2; color:#991b1b;">
            Este enlace no es válido o ya venció. Pide uno nuevo.
          </div>
          <a th:href="@{/auth/olvide}" class="btn-primary w-full" style="display:block; text-align:center;">Pedir un enlace nuevo</a>
        </div>

        <div th:if="${tokenValido}">
          <p class="text-sm mb-6" style="color: var(--muted-foreground);">Usa al menos 8 caracteres.</p>

          <div th:if="${mensajeError}" class="p-3 mb-4 text-sm rounded-lg" style="background-color:#fee2e2; color:#991b1b;">
            <span th:text="${mensajeError}">Error</span>
          </div>

          <form th:action="@{/auth/restablecer}" method="post" autocomplete="off" class="space-y-4">
            <input type="hidden" name="token" th:value="${token}" />
            <div>
              <label class="form-label" for="password">Contraseña nueva</label>
              <input type="password" name="password" id="password" minlength="8" maxlength="100" class="form-input" autocomplete="new-password" required autofocus />
            </div>
            <div>
              <label class="form-label" for="confirmar">Repite la contraseña</label>
              <input type="password" name="confirmar" id="confirmar" minlength="8" maxlength="100" class="form-input" autocomplete="new-password" required />
            </div>
            <button type="submit" class="btn-primary w-full">Guardar contraseña</button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head('Dashboard Admin')}"></head>
  <body class="bg-muted/20" style="background-color: rgba(236,236,240,0.25);">
    <header th:replace="~{fragments/navbar :: navbar}"></header>
    <aside th:replace="~{fragments/admin-sidebar :: sidebar('dashboard')}"></aside>

    <div class="min-h-screen flex flex-col admin-main">
      <main class="flex-1 container mx-auto px-4 py-12">
        <h2 class="text-2xl font-medium text-center mb-8">Panel de Administración</h2>

        <div class="grid md:grid-cols-3 gap-6 mb-12">
          <div class="card text-center">
            <h5 class="text-sm text-muted-foreground mb-2">Clientes</h5>
            <p class="text-4xl font-semibold text-primary" th:text="${clientesCount}">0</p>
          </div>
          <div class="card text-center">
            <h5 class="text-sm text-muted-foreground mb-2">Técnicos</h5>
            <p class="text-4xl font-semibold" style="color:#16a34a" th:text="${tecnicosCount}">0</p>
          </div>
          <div class="card text-center">
            <h5 class="text-sm text-muted-foreground mb-2">Total Pagos</h5>
            <p class="text-4xl font-semibold" style="color:#d97706" th:text="${totalPagos}">0</p>
          </div>
        </div>

      </main>
      <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
  </body>
</html>

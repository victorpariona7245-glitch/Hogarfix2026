<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Clientes registrados')}"></head>
<body class="bg-muted/20" style="background-color: rgba(236,236,240,0.25);">
  <header th:replace="~{fragments/navbar :: navbar}"></header>

  <div class="min-h-screen flex flex-col">
    <main class="flex-1 container mx-auto px-4 py-10">
      <h2 class="text-2xl font-medium mb-6">Listado de clientes (solo lectura)</h2>

      <div th:if="${not #lists.isEmpty(clientes)}">
        <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
          <input
            type="text"
            id="buscar-cliente"
            placeholder="Buscar por nombre, email, DNI..."
            class="w-full max-w-sm border rounded-lg p-2 text-sm"
            style="border-color: var(--border);"
          />
          <div class="flex items-center gap-2">
            <a th:href="@{/admin/exportar/clientes.csv}" class="btn-outline btn-sm">⬇ Exportar CSV</a>
            <a th:href="@{/admin/exportar/clientes.xlsx}" class="btn-primary btn-sm">⬇ Exportar Excel</a>
          </div>
        </div>

        <div class="card overflow-x-auto p-0">
          <table class="table-clean" id="tabla-clientes">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre completo</th>
                <th>Email</th>
                <th>Teléfono</th>
                <th>DNI</th>
                <th>Ciudad</th>
                <th>Fecha registro</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="cliente : ${clientes}">
                <td th:text="${cliente.idCliente}">-</td>
                <td>
                  <span th:text="${cliente.nombres ?: 'N/A'}"></span>
                  <span th:if="${cliente.apellidoPaterno}" th:text="${' ' + cliente.apellidoPaterno}"></span>
                  <span th:if="${cliente.apellidoMaterno}" th:text="${' ' + cliente.apellidoMaterno}"></span>
                </td>
                <td th:text="${cliente.usuario?.email ?: 'N/A'}">-</td>
                <td th:text="${cliente.telefono ?: 'N/A'}">-</td>
                <td th:text="${cliente.dni ?: 'N/A'}">-</td>
                <td th:text="${cliente.direccion?.ciudad?.nombre ?: 'N/A'}">-</td>
                <td th:text="${cliente.createdAt}">-</td>
              </tr>
            </tbody>
          </table>
          <p id="sin-resultados-cliente" class="hidden text-sm p-4" style="color: var(--muted-foreground);">
            No se encontraron clientes que coincidan con la búsqueda.
          </p>
        </div>

        <!-- Controles de paginación -->
        <div class="flex items-center justify-between mt-4 text-sm">
          <span id="tabla-clientes-info" style="color: var(--muted-foreground);"></span>
          <div class="flex items-center gap-2">
            <button type="button" id="tabla-clientes-prev" class="btn-outline btn-sm" onclick="cambiarPagina(-1)">← Anterior</button>
            <span id="tabla-clientes-pagina" class="text-sm font-medium"></span>
            <button type="button" id="tabla-clientes-next" class="btn-outline btn-sm" onclick="cambiarPagina(1)">Siguiente →</button>
          </div>
        </div>
      </div>
      <div th:if="${#lists.isEmpty(clientes)}" class="card text-sm text-muted-foreground">No hay clientes registrados.</div>

      <a th:href="@{/admin/dashboard}" class="btn-outline mt-6 inline-block">Volver</a>

      <script>
        const FILAS_POR_PAGINA = 10;
        let paginaActual = 1;
        const inputBusqueda = document.getElementById('buscar-cliente');
        const tabla = document.getElementById('tabla-clientes');
        const filas = tabla ? Array.from(tabla.querySelectorAll('tbody tr')) : [];

        function aplicarFiltroPaginacion() {
          const filtro = (inputBusqueda?.value || '').trim().toLowerCase();
          const coincidentes = filas.filter((fila) => fila.textContent.toLowerCase().includes(filtro));
          const totalPaginas = Math.max(1, Math.ceil(coincidentes.length / FILAS_POR_PAGINA));
          if (paginaActual > totalPaginas) paginaActual = totalPaginas;

          const inicio = (paginaActual - 1) * FILAS_POR_PAGINA;
          const fin = inicio + FILAS_POR_PAGINA;

          filas.forEach((fila) => {
            const idx = coincidentes.indexOf(fila);
            const visible = idx !== -1 && idx >= inicio && idx < fin;
            fila.style.display = visible ? '' : 'none';
          });

          const mensaje = document.getElementById('sin-resultados-cliente');
          if (mensaje) mensaje.classList.toggle('hidden', coincidentes.length !== 0);

          const desde = coincidentes.length === 0 ? 0 : inicio + 1;
          const hasta = Math.min(fin, coincidentes.length);
          document.getElementById('tabla-clientes-info').textContent =
            'Mostrando ' + desde + '–' + hasta + ' de ' + coincidentes.length;
          document.getElementById('tabla-clientes-pagina').textContent =
            'Página ' + paginaActual + ' de ' + totalPaginas;

          const prevBtn = document.getElementById('tabla-clientes-prev');
          const nextBtn = document.getElementById('tabla-clientes-next');
          prevBtn.disabled = paginaActual === 1;
          nextBtn.disabled = paginaActual === totalPaginas;
          prevBtn.style.opacity = paginaActual === 1 ? '0.5' : '1';
          nextBtn.style.opacity = paginaActual === totalPaginas ? '0.5' : '1';
        }

        function cambiarPagina(delta) {
          paginaActual += delta;
          aplicarFiltroPaginacion();
        }

        if (inputBusqueda) {
          inputBusqueda.addEventListener('input', () => {
            paginaActual = 1;
            aplicarFiltroPaginacion();
          });
        }
        aplicarFiltroPaginacion();
      </script>
    </main>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
  </div>
</body>
</html>

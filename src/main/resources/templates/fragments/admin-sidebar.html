<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Menú lateral del administrador. Uso: th:replace="~{fragments/admin-sidebar :: sidebar('clientes')}" -->
<aside th:fragment="sidebar(activo)" class="admin-sidebar">
  <style>
    /* La barra superior queda fija (el overflow-x:hidden global rompe el "sticky") */
    body { padding-top: 65px; }
    header.sticky { position: fixed; top: 0; left: 0; right: 0; }
    .admin-sidebar { position: fixed; top: 65px; left: 0; bottom: 0; width: 230px; background: #fff;
      border-right: 1px solid var(--border); padding: 1.25rem 0.75rem; overflow-y: auto; z-index: 40; }
    .admin-sidebar .side-title { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase;
      color: var(--muted-foreground); padding: 0 .75rem; margin-bottom: .5rem; }
    .admin-sidebar a { display: flex; align-items: center; justify-content: space-between; gap: .5rem;
      padding: .65rem .75rem; margin-bottom: .25rem; border-radius: .6rem; font-size: .95rem;
      color: var(--foreground); text-decoration: none; transition: background .15s; }
    .admin-sidebar a:hover { background: var(--muted); }
    .admin-sidebar a.active { background: var(--primary); color: #fff; }
    .admin-sidebar .side-badge { background: #fef3c7; color: #92400e; font-size: .7rem; font-weight: 600;
      padding: .1rem .5rem; border-radius: 999px; }
    .admin-main { padding-left: 230px; }
    @media (max-width: 767px) {
      .admin-sidebar { position: static; width: 100%; display: flex; gap: .25rem; overflow-x: auto;
        border-right: 0; border-bottom: 1px solid var(--border); padding: .5rem; }
      .admin-sidebar .side-title { display: none; }
      .admin-sidebar a { white-space: nowrap; margin-bottom: 0; }
      .admin-main { padding-left: 0; }
    }
  </style>
  <p class="side-title">Administración</p>
  <a th:href="@{/admin/dashboard}" th:classappend="${activo == 'dashboard'} ? 'active'">Resumen</a>
  <a th:href="@{/admin/reportes}" th:if="${permisosAdmin == null or permisosAdmin.contains('*') or permisosAdmin.contains('reportes')}" th:classappend="${activo == 'reportes'} ? 'active'">Reporte mensual</a>
  <a th:href="@{/admin/clientes}" th:if="${permisosAdmin == null or permisosAdmin.contains('*') or permisosAdmin.contains('clientes')}" th:classappend="${activo == 'clientes'} ? 'active'">Clientes</a>
  <a th:href="@{/admin/tecnicos}" th:if="${permisosAdmin == null or permisosAdmin.contains('*') or permisosAdmin.contains('tecnicos')}" th:classappend="${activo == 'tecnicos'} ? 'active'">Técnicos</a>
  <a th:href="@{/admin/categorias}" th:if="${permisosAdmin == null or permisosAdmin.contains('*') or permisosAdmin.contains('categorias')}" th:classappend="${activo == 'categorias'} ? 'active'">Especialidades</a>
  <a th:href="@{/admin/administradores}"
     th:if="${session.usuarioActual != null and session.usuarioActual.email == (#strings.isEmpty(@environment.getProperty('app.admin.email')) ? 'admin@example.com' : @environment.getProperty('app.admin.email'))}"
     th:classappend="${activo == 'administradores'} ? 'active'">Administradores</a>
  <a th:href="@{/admin/actividad}" th:if="${permisosAdmin == null or permisosAdmin.contains('*') or permisosAdmin.contains('actividad')}" th:classappend="${activo == 'actividad'} ? 'active'">Actividad</a>
  <a th:href="@{/admin/pagos}" th:if="${permisosAdmin == null or permisosAdmin.contains('*') or permisosAdmin.contains('pagos')}" th:classappend="${activo == 'pagos'} ? 'active'">Pagos</a>
  <a th:href="@{/admin/comisiones}" th:if="${permisosAdmin == null or permisosAdmin.contains('*') or permisosAdmin.contains('comisiones')}" th:classappend="${activo == 'comisiones'} ? 'active'">Cobros y comisiones</a>
  <a th:href="@{/admin/disputas}" th:if="${permisosAdmin == null or permisosAdmin.contains('*') or permisosAdmin.contains('disputas')}" th:classappend="${activo == 'disputas'} ? 'active'">
    <span>Disputas</span>
    <span th:if="${@disputaRepository.countByEstado('ABIERTA') > 0}"
          class="side-badge" th:text="${@disputaRepository.countByEstado('ABIERTA')}">0</span>
  </a>
  <a th:href="@{/admin/certificados}" th:if="${permisosAdmin == null or permisosAdmin.contains('*') or permisosAdmin.contains('certificados')}" th:classappend="${activo == 'certificados'} ? 'active'">
    <span>Certificados</span>
    <span th:if="${certificadosPendientesCount != null and certificadosPendientesCount > 0}"
          class="side-badge" th:text="${certificadosPendientesCount}">0</span>
  </a>
  <script>
    // Ajusta el menú y el contenido a la altura real de la barra superior
    (function () {
      function ajustar() {
        var h = document.querySelector('header');
        var alto = h ? h.offsetHeight : 65;
        document.body.style.paddingTop = alto + 'px';
        var side = document.querySelector('.admin-sidebar');
        if (side && window.innerWidth >= 768) side.style.top = alto + 'px';
      }
      window.addEventListener('load', ajustar);
      window.addEventListener('resize', ajustar);
      ajustar();
    })();
  </script>
</aside>
</body>
</html>

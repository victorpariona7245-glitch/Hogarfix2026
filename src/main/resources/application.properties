spring.application.name=hogarfix
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hogarfix}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

file.upload-dir=uploads/certificados

# Mail configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Brevo (API HTTP). Si BREVO_API_KEY existe, el correo sale por ahí en lugar de SMTP.
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:}
brevo.sender.name=${BREVO_SENDER_NAME:HogarFix}

# Admin inicial: se crea SOLO al arrancar la aplicación, sin configurar nada
# (por defecto admin@example.com / 123456789). Opcional: ADMIN_EMAIL, ADMIN_USERNAME, ADMIN_PASSWORD.
app.admin.email=${ADMIN_EMAIL:}
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}

# Logging levels por paquete
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=ERROR
logging.level.org.springframework.data=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.com.hogarfix=INFO

# --- Validación de DNI contra RENIEC (PeruAPI.com) ---
reniec.api.token=${RENIEC_API_TOKEN:}
reniec.api.url=https://peruapi.com/api/dni/

# --- Pagos y comisión (se configuran con VARIABLES en Railway; no se escriben aquí) ---
# YAPE_NUMERO          número de Yape/Plin de HogarFix que ve el cliente al pagar
# YAPE_TITULAR         nombre con el que aparece ese número
# YAPE_QR_URL          (opcional) imagen del QR, por ejemplo /images/yape-qr.png
# COMISION_PORCENTAJE  % que se queda HogarFix de cada servicio (por defecto 10, máximo 50)
# COMISION_DIAS_GRACIA días para entregar la comisión de un pago en EFECTIVO antes del bloqueo
#                      (por defecto 7; 0 = sin bloqueo)

# URL base pública de tu aplicación. Se usa en los enlaces de los correos (recuperar contraseña).
# En Railway: APP_BASE_URL=https://tu-app.up.railway.app
app.base-url=${APP_BASE_URL:http://localhost:8080}

spring.application.name=hogarfix
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hogarfix}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:12345}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

file.upload-dir=uploads/certificados

# Mail configuration (example). Fill these with your SMTP provider details to enable sending emails.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging levels por paquete
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=ERROR
logging.level.org.springframework.data=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.com.hogarfix=INFO

# --- Validación de DNI contra RENIEC (PeruAPI.com) ---
reniec.api.token=${RENIEC_API_TOKEN}
reniec.api.url=https://peruapi.com/api/dni/

# --- Pasarela de pagos Culqi (dejada configurada por si se retoma más adelante) ---
culqi.public.key=${CULQI_PUBLIC_KEY:}
culqi.secret.key=${CULQI_SECRET_KEY:}

# --- Pasarela de pagos MercadoPago (modo sandbox/pruebas) ---
mercadopago.access.token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.public.key=${MERCADOPAGO_PUBLIC_KEY:}

# URL base pública de tu aplicación (usada para las URLs de retorno de pago).
app.base-url=${APP_BASE_URL:http://localhost:8080}
